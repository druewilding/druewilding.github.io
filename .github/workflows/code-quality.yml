name: Code quality

on:
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: node

      - name: Install dependencies
        run: npm install

      - name: Check package linting
        run: npm run package:lint

      - name: Check code linting
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test the site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The runner only has the newest patch of each Ruby series, so CI uses the
      # latest 3.3.x rather than the exact version in .ruby-version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: node
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
