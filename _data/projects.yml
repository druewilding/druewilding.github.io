# Projects on the homepage, in groups. Each group gets a heading.
#   size: wide    -> spans two columns, image beside the text
#   size: feature -> spans the whole row, big picture beside the text
#   live: daily   -> shows today's colour instead of a screenshot
#   kicker:       -> a small line above the title
#   note:         -> a handwritten note on the tile (keep it short)
# Tip: a group looks tidiest when its tiles fill rows of four
# (a wide tile counts as two).

- group: Games & toys
  projects:
    - title: "Merlin's Castle"
      url: "https://merlinscastle.net/"
      image: merlins-castle-illustrated.jpg
      size: feature
      kicker: Remake of a 1983 BBC Micro adventure
      description: "Anita Straker's adventure game for the BBC Micro, rebuilt from the original program. A painted picture for every place, music and sound effects, or the original teletext screen if you prefer. Plays in your browser, and offline on phones and iPads."
      note: "i'm very proud of this one"
    - title: Chess Variants
      url: /chess/
      image: chess.jpg
      size: wide
      description: Alternative versions of chess, playable against an opponent or a bot
    - title: Push the button
      url: /push-the-button/
      image: push-the-button.png
      description: A button to be pushed when you need to push a button
      note: go on…
    - title: How Old Am I?
      url: /howoldami/
      image: howoldami.png
      description: Work out your exact age

